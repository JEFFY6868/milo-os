<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Milo Drop // Mobile P2P Transfer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070204;
      --bg-panel: rgba(22, 7, 14, 0.85);
      --bg-card: rgba(35, 10, 22, 0.65);
      --border-dim: rgba(255, 8, 56, 0.25);
      --border-bright: #ff0838;
      --accent-red: #ff0838;
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-amber: #ffaa00;
      --text-main: #f8f9fa;
      --text-muted: #9a8c92;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(255, 8, 56, 0.15) 0%, transparent 60%),
        linear-gradient(rgba(255, 8, 56, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 8, 56, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* HEADER */
    .header {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-md);
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span.tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      background: var(--accent-red);
      color: #000;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 3px;
    }

    .target-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 255, 136, 0.12);
      border: 1px solid rgba(0, 255, 136, 0.3);
      padding: 4px 10px;
      border-radius: 20px;
    }

    .target-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* TABS */
    .tab-bar {
      display: flex;
      background: rgba(18, 5, 11, 0.7);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-md);
      padding: 4px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn.active {
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 8, 56, 0.4);
    }

    /* MAIN DROP CARD */
    .card {
      background: var(--bg-panel);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-lg);
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
    }

    .dropzone {
      border: 2px dashed rgba(255, 8, 56, 0.4);
      border-radius: var(--radius-md);
      padding: 34px 16px;
      text-align: center;
      cursor: pointer;
      background: rgba(255, 8, 56, 0.03);
      transition: all 0.2s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .dropzone:active, .dropzone.dragover {
      border-color: var(--accent-cyan);
      background: rgba(0, 240, 255, 0.08);
      transform: scale(0.99);
    }

    .drop-icon {
      font-size: 38px;
    }

    .drop-title {
      font-size: 15px;
      font-weight: 700;
      color: #fff;
    }

    .drop-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    #fileInput {
      display: none;
    }

    /* FILE LIST QUEUE */
    .queue-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 12px;
    }

    .queue-name {
      font-weight: 600;
      color: #fff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 280px;
    }

    .queue-size {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }

    .btn-send {
      background: linear-gradient(135deg, #ff0838, #ff2a55);
      border: none;
      color: #fff;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 0 25px rgba(255, 8, 56, 0.45);
      transition: all 0.2s;
    }

    .btn-send:active {
      transform: scale(0.98);
      filter: brightness(1.2);
    }

    .btn-send:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    /* PROGRESS BAR */
    .progress-wrapper {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-top: 8px;
    }

    .progress-wrapper.show {
      display: flex;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff0838, #00f0ff);
      transition: width 0.15s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* CLIPBOARD SECTION */
    .text-input-area {
      width: 100%;
      height: 100px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-dim);
      border-radius: var(--radius-md);
      padding: 12px;
      color: #fff;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      resize: none;
    }

    .text-input-area:focus {
      border-color: var(--accent-cyan);
    }

    .btn-clipboard {
      background: linear-gradient(135deg, #00f0ff, #0099ff);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-clipboard:active {
      transform: scale(0.98);
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 5, 11, 0.95);
      border: 1px solid var(--accent-green);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER -->
    <header class="header">
      <div class="brand-title">
        <span>✦ MILO DROP</span>
        <span class="tag">P2P</span>
      </div>
      <div class="target-badge">
        <span class="target-dot"></span>
        <span id="targetName">PC // ONLINE</span>
      </div>
    </header>

    <!-- TABS -->
    <div class="tab-bar">
      <button class="tab-btn active" id="tabUploadBtn" onclick="switchTab('upload')">
        <span>📸 Drop Files</span>
      </button>
      <button class="tab-btn" id="tabTextBtn" onclick="switchTab('text')">
        <span>📋 Clipboard</span>
      </button>
      <button class="tab-btn" id="tabDownloadBtn" onclick="switchTab('download')">
        <span>📥 Grab Files</span>
      </button>
    </div>

    <!-- VIEW 1: UPLOAD FILES -->
    <div class="card" id="viewUpload">
      <div class="dropzone" id="dropArea" onclick="document.getElementById('fileInput').click()">
        <span class="drop-icon">📸</span>
        <div class="drop-title">Tap to Choose Files</div>
        <div class="drop-desc">Photos, videos, or documents from your phone</div>
        <input type="file" id="fileInput" multiple onchange="handleFilesSelected(this.files)">
      </div>

      <div id="queueContainer" style="display:none; flex-direction:column; gap:8px;">
        <div class="queue-title">Selected Queue (<span id="queueCount">0</span>)</div>
        <div class="queue-list" id="queueList"></div>
      </div>

      <div class="progress-wrapper" id="progressWrapper">
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="progress-labels">
          <span id="progressPct">0%</span>
          <span id="progressSpeed">Streaming to ~/Downloads</span>
        </div>
      </div>

      <button class="btn-send" id="sendBtn" onclick="uploadFiles()" disabled>
        <span>⚡ DROP TO LAPTOP</span>
      </button>
    </div>

    <!-- VIEW 2: CLIPBOARD / TEXT DROP -->
    <div class="card" id="viewText" style="display:none;">
      <div class="queue-title">Instant Clipboard Teleport</div>
      <textarea class="text-input-area" id="clipboardText" placeholder="Paste link, note, or code snippet to copy directly to laptop clipboard..."></textarea>
      <button class="btn-clipboard" onclick="sendClipboard()">
        <span>📋 SEND TO LAPTOP CLIPBOARD</span>
      </button>
    </div>

    <!-- VIEW 3: DOWNLOAD FILES FROM LAPTOP -->
    <div class="card" id="viewDownload" style="display:none;">
      <div class="queue-title">Files on Laptop (~/Downloads)</div>
      <div class="queue-list" id="pcFilesList">
        <div style="color:var(--text-muted); font-size:12px; text-align:center; padding:20px;">Loading files from PC...</div>
      </div>
      <button class="btn-clipboard" onclick="loadPcFiles()" style="background:rgba(255,255,255,0.08); color:#fff;">
        <span>🔄 Refresh List</span>
      </button>
    </div>

  </div>

  <div id="toast">
    <span>✔</span>
    <span id="toastMsg">Files sent successfully!</span>
  </div>

  <script>
    // The server sets an HttpOnly pairing cookie on first load; drop the token
    // from the address bar so it does not linger in browser history.
    if (location.search.includes('t=')) {
      history.replaceState(null, '', location.pathname);
    }

    let selectedFiles = [];

    function switchTab(tab) {
      document.getElementById('tabUploadBtn').classList.toggle('active', tab === 'upload');
      document.getElementById('tabTextBtn').classList.toggle('active', tab === 'text');
      document.getElementById('tabDownloadBtn').classList.toggle('active', tab === 'download');

      document.getElementById('viewUpload').style.display = (tab === 'upload') ? 'flex' : 'none';
      document.getElementById('viewText').style.display = (tab === 'text') ? 'flex' : 'none';
      document.getElementById('viewDownload').style.display = (tab === 'download') ? 'flex' : 'none';

      if (tab === 'download') loadPcFiles();
    }

    function handleFilesSelected(files) {
      selectedFiles = Array.from(files);
      const queueContainer = document.getElementById('queueContainer');
      const queueList = document.getElementById('queueList');
      const queueCount = document.getElementById('queueCount');
      const sendBtn = document.getElementById('sendBtn');

      if (selectedFiles.length === 0) {
        queueContainer.style.display = 'none';
        sendBtn.disabled = true;
        return;
      }

      queueList.innerHTML = '';
      selectedFiles.forEach((f, idx) => {
        const item = document.createElement('div');
        item.className = 'queue-item';
        const sizeStr = (f.size > 1024*1024) ? (f.size/(1024*1024)).toFixed(1) + ' MB' : (f.size/1024).toFixed(0) + ' KB';
        item.innerHTML = `
          <span class="queue-name">${f.name}</span>
          <span class="queue-size">${sizeStr}</span>
        `;
        queueList.appendChild(item);
      });

      queueCount.innerText = selectedFiles.length;
      queueContainer.style.display = 'flex';
      sendBtn.disabled = false;
    }

    function uploadFiles() {
      if (selectedFiles.length === 0) return;

      const formData = new FormData();
      selectedFiles.forEach(f => formData.append('files', f));

      const xhr = new XMLHttpRequest();
      const progressWrapper = document.getElementById('progressWrapper');
      const progressFill = document.getElementById('progressFill');
      const progressPct = document.getElementById('progressPct');
      const sendBtn = document.getElementById('sendBtn');

      progressWrapper.classList.add('show');
      sendBtn.disabled = true;

      const startTime = Date.now();

      xhr.upload.onprogress = function(e) {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          progressFill.style.width = pct + '%';
          progressPct.innerText = pct + '%';
          const elapsed = (Date.now() - startTime) / 1000;
          if (elapsed > 0) {
            const speedMb = (e.loaded / (1024 * 1024 * elapsed)).toFixed(1);
            document.getElementById('progressSpeed').innerText = speedMb + ' MB/s';
          }
        }
      };

      xhr.onload = function() {
        if (xhr.status === 200) {
          progressFill.style.width = '100%';
          progressPct.innerText = '100%';
          showToast('✔ Saved to ~/Downloads on Alienware M16!');
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
          setTimeout(() => {
            progressWrapper.classList.remove('show');
            selectedFiles = [];
            document.getElementById('queueContainer').style.display = 'none';
            document.getElementById('fileInput').value = '';
          }, 1500);
        } else {
          showToast('✘ Transfer failed: ' + xhr.status);
          sendBtn.disabled = false;
        }
      };

      xhr.onerror = function() {
        showToast('✘ Network error connecting to laptop');
        sendBtn.disabled = false;
      };

      xhr.open('POST', '/upload', true);
      xhr.send(formData);
    }

    function sendClipboard() {
      const text = document.getElementById('clipboardText').value.trim();
      if (!text) return;

      fetch('/clipboard', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: text
      })
      .then(r => r.json())
      .then(d => {
        showToast('✔ Copied directly to Laptop Clipboard!');
        document.getElementById('clipboardText').value = '';
        if (navigator.vibrate) navigator.vibrate(80);
      })
      .catch(e => showToast('✘ Error sending clipboard'));
    }

    function loadPcFiles() {
      const list = document.getElementById('pcFilesList');
      list.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; padding:10px;">Refreshing...</div>';

      fetch('/files')
      .then(r => r.json())
      .then(files => {
        list.innerHTML = '';
        if (!files || files.length === 0) {
          list.innerHTML = '<div style="color:var(--text-muted); font-size:12px; text-align:center; padding:10px;">No files found in ~/Downloads</div>';
          return;
        }
        files.slice(0, 15).forEach(f => {
          const item = document.createElement('div');
          item.className = 'queue-item';
          const sizeStr = (f.size > 1024*1024) ? (f.size/(1024*1024)).toFixed(1) + ' MB' : (f.size/1024).toFixed(0) + ' KB';
          item.innerHTML = `
            <div>
              <div class="queue-name">${f.name}</div>
              <div class="queue-size">${sizeStr}</div>
            </div>
            <a href="/download/${encodeURIComponent(f.name)}" download style="background:var(--accent-cyan); color:#000; text-decoration:none; padding:4px 10px; border-radius:4px; font-size:10px; font-weight:700;">DOWNLOAD</a>
          `;
          list.appendChild(item);
        });
      })
      .catch(e => {
        list.innerHTML = '<div style="color:var(--accent-red); font-size:12px; text-align:center; padding:10px;">Error loading files</div>';
      });
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
